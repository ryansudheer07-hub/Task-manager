{% extends 'base.html' %}
{% block title %}Edit nudge · Nudge{% endblock %}
{% block body %}<section class="form-card glass"><p class="eyebrow">refine the signal</p><h1>Edit this nudge.</h1><p class="sub">Keep the task honest, specific, and easy to start.</p><form action="{{ url_for('update', id=task.id) }}" method="POST" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Task<input class="field" type="text" name="content" id="content" required value="{{ task.content }}"></label><label class="form-label">Estimated minutes<input class="field" type="number" name="estimated_minutes" id="estimated_minutes" min="{{ min_minutes }}" max="{{ max_minutes }}" value="{{ task.estimated_minutes or '' }}"></label><div style="display:flex;gap:9px"><button class="btn btn-primary" type="submit">Save changes ↗</button><a class="btn btn-ghost" href="{{ url_for('home') }}">Cancel</a></div></form></section>{% endblock %}
